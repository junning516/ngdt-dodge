:root{
  --yellow:#FFC800;--red:#E8261C;--asphalt:#232A3B;--ink:#14171F;--paint:#FBFAF4;--vest:#C8F031;
  --u:3.9px;--v:8.44px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --pad:clamp(128px,min(calc(var(--u)*40),calc(var(--v)*22)),176px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--paint);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
img{-webkit-user-drag:none;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--paint);outline-offset:3px}
#app{position:fixed;top:0;bottom:0;left:50%;width:100%;max-width:480px;transform:translateX(-50%);display:flex;flex-direction:column;background:var(--asphalt);overflow:hidden}

#hud{flex:none;display:flex;align-items:center;gap:calc(var(--u)*5);padding:calc(var(--safe-t) + 8px) 14px 8px;background:var(--asphalt)}
.stat{display:flex;align-items:baseline;gap:5px;font-size:12px;color:#C5CAD6;white-space:nowrap}
.stat b{font:400 24px/1 "Hazard",sans-serif;color:var(--yellow);font-variant-numeric:tabular-nums}
#sound{margin-left:auto;width:44px;height:36px;display:grid;place-items:center;border-radius:8px;background:#343D52}
#sound svg{width:22px;height:22px;fill:none;stroke:var(--paint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#sound .off{display:none}#sound.muted .on{display:none}#sound.muted .off{display:inline}

#stage{flex:1;min-height:0;position:relative;background:#B8B5AA}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

#deck{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;
  padding:20px calc(var(--u)*5) calc(var(--safe-b) + 12px);background:var(--asphalt)}
#deck::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
#pad{position:relative;width:var(--pad);height:var(--pad);border-radius:50%;background:#343D52;box-shadow:inset 0 0 0 3px #4A5570;touch-action:none}
.arm{position:absolute;width:36%;height:36%;display:grid;place-items:center;background:#E9E7DD;border-radius:9px;box-shadow:0 4px 0 #9A9A92;transition:transform .05s}
.arm i{display:block;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:15px solid var(--asphalt)}
.arm.u{left:32%;top:3%}.arm.d{left:32%;bottom:3%}.arm.l{left:3%;top:32%}.arm.r{right:3%;top:32%}
.arm.d i{transform:rotate(180deg)}.arm.l i{transform:rotate(-90deg)}.arm.r i{transform:rotate(90deg)}
.arm.on{background:var(--yellow);transform:translateY(3px);box-shadow:0 1px 0 #9A7A00}
#hit{width:calc(var(--pad)*.78);height:calc(var(--pad)*.78);border-radius:50%;background:var(--red);box-shadow:0 7px 0 #8F120C,inset 0 0 0 4px #FF6A5F;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none;transition:transform .05s}
#hit svg{width:46%;height:46%}
#hit span{font:400 clamp(15px,calc(var(--u)*4.4),19px)/1 "Hazard",sans-serif}
#hit.on{transform:translateY(5px);box-shadow:0 2px 0 #8F120C,inset 0 0 0 4px #FF6A5F}

.screen{position:absolute;inset:0;z-index:10;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}

#title{background:var(--yellow);color:var(--ink);padding:calc(var(--safe-t) + calc(var(--v)*3)) 0 calc(var(--safe-b) + calc(var(--v)*3));justify-content:space-between}
#title h1{margin:0;font:400 calc(min(var(--u)*25,var(--v)*13))/.92 "Hazard",sans-serif;text-align:center;transform:rotate(-3deg);letter-spacing:-.01em}
#title h1 span{display:block;background:var(--ink);color:var(--yellow);padding:.08em .22em .1em;margin-top:.1em;font-size:.86em}
#crowd{position:relative;width:100%;flex:1;min-height:0;margin:calc(var(--v)*2) 0}
#crowd img{position:absolute;filter:drop-shadow(0 3px 0 rgba(20,23,31,.45))}
.brief{margin:0 0 calc(var(--v)*1.6);padding:0 24px;text-align:center;font-size:clamp(14px,calc(var(--u)*4),17px);font-weight:700;line-height:1.5}
.cta{min-width:calc(var(--u)*64);height:60px;padding:0 28px;border-radius:12px;background:var(--red);color:var(--paint);font:400 26px/1 "Hazard",sans-serif;box-shadow:0 6px 0 #8F120C}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 #8F120C}
.cta[disabled]{opacity:.55}
#bestline{min-height:20px;margin:12px 0 0;font-size:14px;font-weight:700}

#down{overflow:hidden;background:var(--red);justify-content:center;padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 16px)}
#rays{position:absolute;left:50%;top:38%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;
  background:repeating-conic-gradient(var(--yellow) 0 9deg,var(--red) 9deg 18deg)}
#down.on #rays{animation:spin 14s linear infinite}
#face{position:relative;display:block;width:min(calc(var(--u)*88),calc(var(--v)*47));height:min(calc(var(--u)*88),calc(var(--v)*47));filter:drop-shadow(0 8px 0 rgba(20,23,31,.55))}
#down.on #face{animation:slam .34s cubic-bezier(.2,1.4,.4,1) both,quake .4s .3s linear both}
#bubble{position:relative;margin-top:calc(var(--v)*-1.5);padding:.1em .55em .16em;background:var(--paint);color:var(--ink);border:5px solid var(--ink);border-radius:22px;
  font:400 calc(min(var(--u)*17,var(--v)*9))/1.1 "Hazard",sans-serif;white-space:nowrap;box-shadow:6px 7px 0 var(--ink)}
#bubble::before{content:"";position:absolute;left:24%;top:-27px;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:24px solid var(--ink)}
#bubble::after{content:"";position:absolute;left:calc(24% + 6px);top:-15px;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:15px solid var(--paint)}
#down.on #bubble{animation:pop .26s .3s cubic-bezier(.2,1.7,.4,1) both}
#result{position:relative;margin:calc(var(--v)*2.2) 0 calc(var(--v)*1.8);padding:7px 14px;background:var(--ink);color:var(--paint);border-radius:8px;font-size:clamp(14px,calc(var(--u)*4),17px);font-weight:700;text-align:center;line-height:1.45}
#result em{font-style:normal;color:var(--yellow)}
#down .cta{position:relative;background:var(--ink);box-shadow:0 6px 0 rgba(20,23,31,.45)}

#pause{background:rgba(20,23,31,.86);justify-content:center;gap:20px}
#pause p{margin:0;font:400 34px/1 "Hazard",sans-serif;color:var(--yellow)}
#turn{position:absolute;inset:0;z-index:30;display:none;place-items:center;background:var(--asphalt);color:var(--yellow);font:400 26px/1.3 "Hazard",sans-serif;text-align:center;padding:20px}
@media (orientation:landscape) and (max-height:500px){#turn{display:grid}}

@keyframes slam{0%{transform:scale(4.2) rotate(-14deg);opacity:0}45%{opacity:1}100%{transform:none;opacity:1}}
@keyframes quake{0%,100%{translate:0 0}20%{translate:-9px 6px}40%{translate:8px -7px}60%{translate:-6px -4px}80%{translate:5px 4px}}
@keyframes pop{0%{transform:scale(0) rotate(-16deg)}100%{transform:rotate(-3deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  #down.on #rays{animation:none}
  #down.on #face{animation:none}
  #down.on #bubble{animation:none;transform:rotate(-3deg)}
}
#gate{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;background:var(--yellow);color:var(--ink);
  padding:calc(var(--safe-t) + 8vh) 24px calc(var(--safe-b) + 24px)}
#gate h2{margin:0 0 6vh;font:400 min(23vw,108px)/.92 "Hazard",sans-serif;text-align:center;transform:rotate(-3deg)}
#gate h2 span{display:block;background:var(--ink);color:var(--yellow);padding:.08em .22em .1em;margin-top:.1em;font-size:.86em}
#gate form{width:min(100%,320px);display:flex;flex-direction:column;gap:12px}
#gate label{font-size:17px;font-weight:700;text-align:center}
#pw{width:100%;height:66px;border:4px solid var(--ink);border-radius:12px;background:var(--paint);color:var(--ink);font-size:30px;font-weight:700;text-align:center;letter-spacing:.2em;
  -webkit-user-select:text;user-select:text;touch-action:manipulation;-webkit-appearance:none;appearance:none}
#pw:focus{outline:3px solid var(--red);outline-offset:2px}
#gate .cta{width:100%;min-width:0}
#gateMsg{min-height:24px;margin:0;color:#9E0E07;font-size:15px;font-weight:700;text-align:center}
</style>
</head>
<body>
<main id="app">
  <header id="hud">
    <div class="stat">버틴 시간 <b id="t">0.0</b></div>
    <div class="stat">때린 수 <b id="ko">0</b></div>
    <button id="sound" type="button" aria-label="소리 켜기 또는 끄기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="off" d="m16 9.5 5 5m0-5-5 5"/></svg>
    </button>
  </header>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="deck">
    <div id="pad" role="group" aria-label="방향키">
      <div class="arm u"><i></i></div><div class="arm d"><i></i></div><div class="arm l"><i></i></div><div class="arm r"><i></i></div>
    </div>
    <button id="hit" type="button" aria-label="망치로 때리기">
      <svg viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate(-38 24 24)"><rect x="21" y="16" width="6" height="30" rx="2.5" fill="#FBFAF4"/><rect x="7" y="3" width="34" height="18" rx="5" fill="#FFC800" stroke="#14171F" stroke-width="3"/></g></svg>
      <span>때리기</span>
    </button>
  </div>

  <section id="title" class="screen on">
    <h1>NGDT<span>피하기</span></h1>
    <div id="crowd" aria-hidden="true"></div>
    <p class="brief">방향키로 피하고 망치로 때리세요.<br>한 명이라도 닿으면 따운입니다.</p>
    <button id="start" class="cta" type="button" disabled>시작하기</button>
    <p id="bestline"></p>
  </section>

  <section id="down" class="screen" aria-live="assertive">
    <div id="rays"></div>
    <img id="face" alt="">
    <div id="bubble">따운 ㅋ</div>
    <p id="result"></p>
    <button id="again" class="cta" type="button">다시 하기</button>
  </section>

  <section id="pause" class="screen">
    <p>잠깐 멈춤</p>
    <button id="resume" class="cta" type="button">계속하기</button>
  </section>
  <div id="turn">휴대폰을 세로로<br>돌려주세요</div>
  <section id="gate">
    <h2>NGDT<span>피하기</span></h2>
    <form id="gateForm" autocomplete="off">
      <label for="pw">비밀번호를 입력하세요</label>
      <input id="pw" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <p id="gateMsg" role="alert"></p>
      <button id="gateBtn" class="cta" type="submit">입장하기</button>
    </form>
  </section>
</main>

<script>
window.__startGame=FACES=>{'use strict';
const $=s=>document.querySelector(s);
const app=$('#app'),stage=$('#stage'),cv=$('#c'),ctx=cv.getContext('2d');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b));

/* 화면 크기 */
let W=390,H=500,dpr=1,bg=null;
function fit(){
  const r=app.getBoundingClientRect();
  app.style.setProperty('--u',r.width/100+'px');app.style.setProperty('--v',r.height/100+'px');
  const s=stage.getBoundingClientRect();
  W=Math.max(200,Math.round(s.width));H=Math.max(200,Math.round(s.height));
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  buildBg();
  if(player){player.x=clamp(player.x,B.l(),B.r());player.y=clamp(player.y,B.t(),B.b())}
  layoutCrowd();
  if(mode==='play'&&innerWidth>innerHeight&&innerHeight<500)pause();
  if(mode!=='play')draw();
}
const B={l:()=>30,r:()=>W-30,t:()=>52,b:()=>H-24};

/* 바닥: 콘크리트 슬래브와 안전 테이프 */
function buildBg(){
  bg=document.createElement('canvas');bg.width=cv.width;bg.height=cv.height;
  const g=bg.getContext('2d');g.scale(dpr,dpr);
  g.fillStyle='#B8B5AA';g.fillRect(0,0,W,H);
  let seed=7;const r=()=>(seed=(seed*16807)%2147483647)/2147483647;
  for(let i=0;i<W*H/170;i++){g.fillStyle=r()>.5?'rgba(255,255,255,.13)':'rgba(40,40,36,.10)';const s=r()*2.2+.5;g.fillRect(r()*W,r()*H,s,s)}
  for(let i=0;i<5;i++){g.fillStyle='rgba(60,58,50,.07)';g.beginPath();g.ellipse(r()*W,r()*H,20+r()*44,12+r()*26,r()*3,0,7);g.fill()}
  g.strokeStyle='rgba(70,68,60,.34)';g.lineWidth=2;
  for(let x=W%120/2;x<W;x+=120){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}
  for(let y=30;y<H;y+=120){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  g.save();g.translate(W/2,H/2);g.rotate(-.14);g.fillStyle='rgba(35,42,59,.13)';g.textAlign='center';g.textBaseline='middle';
  g.font=`${Math.round(W*.27)}px Hazard,sans-serif`;g.fillText('NGDT',0,0);g.restore();
  const t=12;g.save();g.beginPath();g.rect(0,0,W,H);g.rect(t,t,W-t*2,H-t*2);g.clip('evenodd');
  g.fillStyle='#FFC800';g.fillRect(0,0,W,H);g.strokeStyle='#14171F';g.lineWidth=9;
  for(let i=-H;i<W+H;i+=26){g.beginPath();g.moveTo(i,0);g.lineTo(i+H,H);g.stroke()}
  g.restore();
}

/* 얼굴 스프라이트 */
const VESTS=['#FF7A1A','#C8F031','#2F6BFF','#FFC800','#F4F4EE','#E8261C'];
const HEAD=66;let imgs=[],sprites=[];
function makeSprites(){
  sprites=imgs.map(im=>{const c=document.createElement('canvas');c.width=c.height=Math.round(HEAD*2);
    const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(im,0,0,c.width,c.height);return c});
}
function layoutCrowd(){
  const box=$('#crowd');if(!imgs.length)return;
  const bw=box.clientWidth,bh=box.clientHeight;if(!bw||!bh)return;
  const cols=4,rows=3,cw=bw/cols,ch=bh/rows,size=Math.min(cw*1.22,ch*1.24);
  if(!box.children.length){FACES.forEach((src,i)=>{const m=new Image();m.src=src;m.alt='';box.appendChild(m)})}
  const tilt=[-9,6,-4,11,7,-12,5,-7,-5,9,-10,6];
  [...box.children].forEach((m,i)=>{const c=i%cols,r=Math.floor(i/cols),off=r%2?cw*.09:-cw*.09;
    m.style.width=m.style.height=size+'px';
    m.style.left=clamp(c*cw+cw/2-size/2+off,-size*.08,bw-size*.92)+'px';
    m.style.top=r*ch+ch/2-size/2+'px';
    m.style.transform=`rotate(${tilt[i]}deg)`;m.style.zIndex=(i*5)%12});
}

/* 소리 */
let ac=null,muted=store.get('ngdt-mute','0')==='1';
$('#sound').classList.toggle('muted',muted);
function unlock(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume()}catch(e){}
  try{if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}
}
function tone(f0,f1,d,type,vol){
  if(muted||!ac)return;
  try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}
const sfx={swing(){tone(300,130,.09,'triangle',.12)},bonk(){tone(620,1500,.09,'square',.13);tone(1500,500,.14,'sine',.16)},
  down(){tone(190,38,.5,'sawtooth',.34);tone(90,34,.6,'square',.26)}};
function say(){
  if(muted||!window.speechSynthesis)return;
  try{const vs=speechSynthesis.getVoices();const ko=vs.find(v=>/^ko/i.test(v.lang));if(vs.length&&!ko)return;
    speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('따운 크크');u.lang='ko-KR';if(ko)u.voice=ko;u.rate=1.05;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* 입력 */
const pad={x:0,y:0},keys=new Set();let attackHeld=false;
const arms={u:$('.arm.u'),d:$('.arm.d'),l:$('.arm.l'),r:$('.arm.r')};
function setPad(x,y){pad.x=x;pad.y=y;arms.u.classList.toggle('on',y<0);arms.d.classList.toggle('on',y>0);arms.l.classList.toggle('on',x<0);arms.r.classList.toggle('on',x>0)}
const padEl=$('#pad');let padId=null;
function readPad(e){
  const r=padEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy);
  if(len<r.width*.1)return setPad(0,0);
  setPad(Math.abs(dx)/len>.42?Math.sign(dx):0,Math.abs(dy)/len>.42?Math.sign(dy):0);
}
padEl.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;try{padEl.setPointerCapture(padId)}catch(x){}readPad(e)});
padEl.addEventListener('pointermove',e=>{if(e.pointerId===padId)readPad(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>padEl.addEventListener(t,e=>{if(e.pointerId===padId){padId=null;setPad(0,0)}}));
const hitEl=$('#hit');
hitEl.addEventListener('pointerdown',e=>{e.preventDefault();try{hitEl.setPointerCapture(e.pointerId)}catch(x){}attackHeld=true;hitEl.classList.add('on');attack()});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>hitEl.addEventListener(t,()=>{attackHeld=false;hitEl.classList.remove('on')}));
const KEYMAP={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r',W:'u',S:'d',A:'l',D:'r'};
addEventListener('keydown',e=>{
  if(KEYMAP[e.key]){keys.add(KEYMAP[e.key]);e.preventDefault()}
  if(e.key===' '||e.key==='j'||e.key==='J'){e.preventDefault();if(mode==='play'){attackHeld=true;attack()}}
  if(e.key==='Enter'){if(mode==='title'&&!$('#start').disabled)start();else if(mode==='down'&&!$('#again').disabled)start();else if(mode==='pause')resume()}
});
addEventListener('keyup',e=>{if(KEYMAP[e.key])keys.delete(KEYMAP[e.key]);if(e.key===' '||e.key==='j'||e.key==='J')attackHeld=false});
['touchmove','gesturestart','gesturechange','dblclick','contextmenu'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<320&&!e.target.closest('.cta'))e.preventDefault();lastTouch=n},{passive:false});

/* 게임 상태 */
let mode='title',player=null,foes=[],bits=[],words=[],clock=0,kos=0,spawnIn=0,bag=[],lastFace=-1,hitstop=0,shake=0,flash=0,killer=null,swingId=0,last=0;
let best=parseFloat(store.get('ngdt-best','0'))||0;
function showBest(){$('#bestline').textContent=best>0?`최고 기록 ${best.toFixed(1)}초`:''}
showBest();
function show(id){['title','down','pause'].forEach(n=>$('#'+n).classList.toggle('on',n===id))}

function start(){
  unlock();try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  player={x:W/2,y:H*.56,face:-Math.PI/2,swing:0,cool:0,inv:1.5,step:0,moving:false,hitDone:false};
  foes=[];bits=[];words=[];clock=0;kos=0;spawnIn=.5;bag=[];hitstop=0;shake=0;flash=0;killer=null;attackHeld=false;
  setPad(0,0);show(null);mode='play';last=performance.now();
}
function pause(){if(mode!=='play')return;mode='pause';show('pause');setPad(0,0);keys.clear();attackHeld=false}
function resume(){if(mode!=='pause')return;show(null);mode='play';last=performance.now()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

function nextFace(){
  if(!bag.length){bag=FACES.map((_,i)=>i);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}
    if(bag[bag.length-1]===lastFace)bag.unshift(bag.pop())}
  return lastFace=bag.pop();
}
function spawn(){
  const r=Math.random(),m=46;let x,y;
  if(r<.34){x=rand(40,W-40);y=-m}else if(r<.6){x=-m;y=rand(60,H-40)}else if(r<.86){x=W+m;y=rand(60,H-40)}else{x=rand(40,W-40);y=H+m}
  const k=Math.random();let type='chase';
  if(clock>14&&k<.24)type='dash';else if(clock>7&&k<.52)type='wobble';
  const f=nextFace();
  const e={f,x,y,type,state:'walk',spd:Math.min(150,60+clock*2.3)*rand(.86,1.14),dir:Math.atan2(player.y-y,player.x-x),t:rand(0,6),vest:VESTS[f%VESTS.length],rot:0,vr:0,vx:0,vy:0,life:1,aim:0,tx:0,ty:0};
  if(type==='dash'){e.x=clamp(x,22,W-22);e.y=clamp(y,30,H-14);e.state='aim';e.aim=.8}
  foes.push(e);
}
function attack(){
  if(mode!=='play'||!player||player.cool>0)return;
  player.swing=.24;player.cool=.36;player.hitDone=false;swingId++;sfx.swing();
}
function bonk(e){
  const a=Math.atan2(e.y-player.y,e.x-player.x);
  e.state='ko';e.vx=Math.cos(a)*560;e.vy=Math.sin(a)*560-120;e.vr=(Math.random()<.5?-1:1)*rand(14,22);e.life=.55;
  kos++;hitstop=.045;shake=Math.max(shake,.12);sfx.bonk();buzz(18);
  for(let i=0;i<10;i++){const b=rand(0,6.28),s=rand(90,300);bits.push({x:e.x,y:e.y-14,vx:Math.cos(b)*s,vy:Math.sin(b)*s,life:rand(.25,.5),c:i%2?'#FFC800':'#FBFAF4',s:rand(3,7)})}
  words.push({x:e.x,y:e.y-44,txt:['뽁!','빡!','퍽!'][Math.floor(Math.random()*3)],life:.6});
}
function die(e){
  mode='dying';killer=e;flash=1;shake=.35;hitstop=0;sfx.down();buzz([70,40,140]);setPad(0,0);
  setTimeout(showDown,300);
}
function showDown(){
  const rec=clock>best;if(rec){best=clock;store.set('ngdt-best',best.toFixed(1));showBest()}
  $('#face').src=FACES[killer.f];
  $('#result').innerHTML=`<em>${clock.toFixed(1)}초</em> 버티고 <em>${kos}명</em> 때렸습니다`+(rec?'<br>새 기록입니다':`<br>최고 기록 ${best.toFixed(1)}초`);
  const d=$('#down');d.classList.remove('on');void d.offsetWidth;show('down');mode='down';
  const btn=$('#again');btn.disabled=true;setTimeout(()=>{btn.disabled=false},750);
  setTimeout(say,300);
}

function update(dt){
  clock+=dt;
  const p=player;
  let mx=pad.x+(keys.has('r')?1:0)-(keys.has('l')?1:0),my=pad.y+(keys.has('d')?1:0)-(keys.has('u')?1:0);
  mx=clamp(mx,-1,1);my=clamp(my,-1,1);
  p.moving=!!(mx||my);
  if(p.moving){const l=Math.hypot(mx,my);p.x=clamp(p.x+mx/l*192*dt,B.l(),B.r());p.y=clamp(p.y+my/l*192*dt,B.t(),B.b());p.face=Math.atan2(my,mx);p.step+=dt*14}
  p.inv=Math.max(0,p.inv-dt);p.cool=Math.max(0,p.cool-dt);
  if(attackHeld&&p.cool<=0)attack();

  spawnIn-=dt;
  const live=foes.filter(e=>e.state!=='ko').length;
  if(spawnIn<=0&&live<Math.min(18,5+Math.floor(clock/5))){spawn();spawnIn=Math.max(.36,1.2-clock*.018)}

  /* 망치 판정을 충돌보다 먼저 처리한다 */
  if(p.swing>0){
    p.swing=Math.max(0,p.swing-dt);
    if(p.swing>.08)for(const e of foes){if(e.state==='ko')continue;
      const dx=e.x-p.x,dy=(e.y-10)-(p.y-8),d=Math.hypot(dx,dy);
      if(d<46||(d<88&&Math.abs(angDiff(Math.atan2(dy,dx),p.face))<1.35))bonk(e)}
  }
  for(const e of foes){
    e.t+=dt;
    if(e.state==='ko'){e.x+=e.vx*dt;e.y+=e.vy*dt;e.vy+=500*dt;e.rot+=e.vr*dt;e.life-=dt;continue}
    if(e.state==='aim'){e.aim-=dt;if(e.aim>.22){e.tx=p.x;e.ty=p.y}
      if(e.aim<=0){e.state='dash';e.dir=Math.atan2(e.ty-e.y,e.tx-e.x);e.spd=Math.min(470,340+clock*1.6)}}
    else if(e.state==='dash'){e.x+=Math.cos(e.dir)*e.spd*dt;e.y+=Math.sin(e.dir)*e.spd*dt;if(e.x<-70||e.x>W+70||e.y<-70||e.y>H+70)e.life=0}
    else{
      const want=Math.atan2(p.y-e.y,p.x-e.x),turn=2.5*dt;e.dir+=clamp(angDiff(want,e.dir),-turn,turn);
      let vx=Math.cos(e.dir)*e.spd,vy=Math.sin(e.dir)*e.spd;
      if(e.type==='wobble'){const s=Math.sin(e.t*5)*95;vx+=-Math.sin(e.dir)*s;vy+=Math.cos(e.dir)*s}
      e.x+=vx*dt;e.y+=vy*dt;
    }
    if(p.inv<=0&&mode==='play'&&Math.hypot(e.x-p.x,(e.y-8)-(p.y-6))<29){die(e);return}
  }
  for(let i=0;i<foes.length;i++){const a=foes[i];if(a.state!=='walk')continue;
    for(let j=i+1;j<foes.length;j++){const b=foes[j];if(b.state!=='walk')continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d<44){const k=(44-d)/d*.5;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k}}}
  foes=foes.filter(e=>e.life>0);
  fx(dt);
}
function fx(dt){
  for(const b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=420*dt;b.life-=dt}
  bits=bits.filter(b=>b.life>0);
  for(const w of words){w.y-=44*dt;w.life-=dt}
  words=words.filter(w=>w.life>0);
  shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*4);
}

/* 그리기 */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function shadow(x,y,w){ctx.fillStyle='rgba(20,23,31,.26)';ctx.beginPath();ctx.ellipse(x,y,w,w*.36,0,0,7);ctx.fill()}
function drawFoe(e){
  ctx.save();ctx.translate(e.x,e.y);
  if(e.state==='ko'){ctx.rotate(e.rot);ctx.globalAlpha=clamp(e.life/.3,0,1)}
  else shadow(0,17,19);
  const sw=Math.sin(e.t*11)*4;
  if(e.state==='aim'){ctx.translate(Math.sin(e.t*60)*2,0)}
  ctx.fillStyle='#232A3B';rr(-11,8,8,11+sw*.5,3);ctx.fill();rr(3,8,8,11-sw*.5,3);ctx.fill();
  ctx.fillStyle=e.vest;ctx.strokeStyle='#14171F';ctx.lineWidth=2.5;rr(-15,-8,30,21,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(251,250,244,.85)';ctx.fillRect(-14,2,28,4);
  ctx.translate(0,-22+Math.sin(e.t*11)*1.6);ctx.rotate(Math.sin(e.t*5.5)*.1);
  ctx.drawImage(sprites[e.f],-HEAD/2,-HEAD/2,HEAD,HEAD);
  ctx.restore();
}
function drawAim(e){
  ctx.save();ctx.strokeStyle='rgba(232,38,28,.8)';ctx.lineWidth=4;ctx.setLineDash([12,10]);ctx.lineDashOffset=-e.t*60;
  const a=Math.atan2(e.ty-e.y,e.tx-e.x),L=Math.hypot(W,H);ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x+Math.cos(a)*L,e.y+Math.sin(a)*L);ctx.stroke();ctx.restore();
  ctx.fillStyle='#E8261C';ctx.strokeStyle='#FBFAF4';ctx.lineWidth=4;ctx.font='30px Hazard,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const y=clamp(e.y-66,22,H);ctx.strokeText('!',e.x,y);ctx.fillText('!',e.x,y);
}
function drawHammer(p){
  const k=p.swing>0?1-p.swing/.24:0,ease=1-Math.pow(1-k,3);
  const a=p.swing>0?p.face-1.5+ease*3:p.face+1.15;
  ctx.save();ctx.translate(p.x,p.y-8);ctx.rotate(a);
  ctx.fillStyle='#FBFAF4';ctx.strokeStyle='#14171F';ctx.lineWidth=2;rr(8,-3,44,6,3);ctx.fill();ctx.stroke();
  ctx.fillStyle='#E8261C';ctx.lineWidth=2.5;rr(46,-17,24,34,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#FFC800';ctx.fillRect(52,-16,5,32);
  ctx.restore();
  if(p.swing>.06){ctx.save();ctx.strokeStyle='rgba(251,250,244,.75)';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.arc(p.x,p.y-8,64,p.face-1.5,a);ctx.stroke();ctx.restore()}
}
function drawPlayer(p){
  if(p.inv>0&&Math.floor(p.inv*12)%2===0)ctx.globalAlpha=.45;
  shadow(p.x,p.y+17,17);
  const sw=p.moving?Math.sin(p.step)*5:0,fx=Math.cos(p.face)*4,fy=Math.max(0,Math.sin(p.face))*2;
  ctx.save();ctx.translate(p.x,p.y);
  ctx.fillStyle='#232A3B';rr(-10,8,8,10+sw,3);ctx.fill();rr(2,8,8,10-sw,3);ctx.fill();
  ctx.fillStyle='#C8F031';ctx.strokeStyle='#14171F';ctx.lineWidth=2.5;rr(-14,-8,28,20,6);ctx.fill();ctx.stroke();
  ctx.fillStyle='#FF7A1A';ctx.fillRect(-13,2,26,4);
  ctx.fillStyle='#F2C79E';ctx.beginPath();ctx.arc(0,-20,15,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#14171F';ctx.beginPath();ctx.arc(-5+fx,-18+fy,2.3,0,7);ctx.arc(5+fx,-18+fy,2.3,0,7);ctx.fill();
  ctx.fillStyle='#FFC800';ctx.beginPath();ctx.arc(0,-24,15.5,Math.PI,0);ctx.closePath();ctx.fill();ctx.stroke();
  rr(-19,-26,38,5,2.5);ctx.fill();ctx.stroke();
  ctx.restore();ctx.globalAlpha=1;
}
function draw(){
  if(!bg)return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(shake>0&&!calm)ctx.translate(rand(-1,1)*shake*30,rand(-1,1)*shake*30);
  ctx.drawImage(bg,0,0,W,H);
  if(!player)return;
  for(const e of foes)if(e.state==='aim')drawAim(e);
  const list=[...foes,player].sort((a,b)=>a.y-b.y);
  for(const o of list){if(o===player){drawHammer(o);drawPlayer(o)}else drawFoe(o)}
  for(const b of bits){ctx.globalAlpha=clamp(b.life*4,0,1);ctx.fillStyle=b.c;ctx.fillRect(b.x-b.s/2,b.y-b.s/2,b.s,b.s)}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='32px Hazard,sans-serif';ctx.lineJoin='round';
  for(const w of words){ctx.globalAlpha=clamp(w.life*4,0,1);ctx.lineWidth=7;ctx.strokeStyle='#14171F';ctx.strokeText(w.txt,w.x,w.y);ctx.fillStyle='#FFC800';ctx.fillText(w.txt,w.x,w.y)}
  ctx.globalAlpha=1;
  if(flash>0){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=`rgba(251,250,244,${flash*.85})`;ctx.fillRect(0,0,W,H)}
}
const tEl=$('#t'),koEl=$('#ko');let shownT='',shownK='';
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(mode==='play'){if(hitstop>0){hitstop-=dt;fx(dt)}else update(dt)}
  else if(mode==='dying')fx(dt);
  if(mode==='play'||mode==='dying'){
    draw();
    const a=clock.toFixed(1),b=String(kos);if(a!==shownT){tEl.textContent=shownT=a}if(b!==shownK){koEl.textContent=shownK=b}
  }
  requestAnimationFrame(frame);
}

/* 버튼 */
$('#start').addEventListener('click',start);$('#again').addEventListener('click',start);$('#resume').addEventListener('click',resume);
$('#sound').addEventListener('click',()=>{muted=!muted;store.set('ngdt-mute',muted?'1':'0');$('#sound').classList.toggle('muted',muted);if(muted){try{speechSynthesis.cancel()}catch(e){}}else unlock()});
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);

/* 준비 */
const fontReady=(document.fonts&&document.fonts.load)?document.fonts.load('32px Hazard','따운').catch(()=>{}):Promise.resolve();
const loaded=FACES.map(src=>new Promise(res=>{const m=new Image();m.onload=()=>res(m);m.onerror=()=>res(null);m.src=src}));
Promise.all([fontReady,...loaded]).then(r=>{
  imgs=r.slice(1).filter(Boolean);makeSprites();fit();$('#start').disabled=false;last=performance.now();requestAnimationFrame(frame);
});
};

const $=s=>document.querySelector(s),gate=$('#gate'),form=$('#gateForm'),pw=$('#pw'),msg=$('#gateMsg'),btn=$('#gateBtn');
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const load=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
const save=v=>{try{localStorage.setItem(KEY,v)}catch(e){}};
const drop=()=>{try{localStorage.removeItem(KEY)}catch(e){}};
async function derive(text){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(text),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(P.salt),iterations:P.iter},k,256));
}
async function unlock(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(P.iv)},k,bytes(P.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function enter(faces){gate.remove();window.__startGame(faces)}
if(!window.crypto||!crypto.subtle){msg.textContent='이 브라우저에서는 열 수 없습니다. Chrome이나 Safari로 열어 주세요.';btn.disabled=true;return}
form.addEventListener('submit',async e=>{
  e.preventDefault();btn.disabled=true;btn.textContent='여는 중';msg.textContent='';
  try{const raw=await derive(pw.value);const faces=await unlock(raw);save(btoa(String.fromCharCode(...raw)));enter(faces)}
  catch(x){msg.textContent='비밀번호가 맞지 않습니다. 다시 입력해 주세요.';pw.value='';btn.disabled=false;btn.textContent='입장하기';pw.focus()}
});
const saved=load();
if(saved)unlock(bytes(saved)).then(enter).catch(drop);
})();</script>
